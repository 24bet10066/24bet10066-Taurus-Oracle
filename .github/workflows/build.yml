name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared-lib:        ['shared-lib/**', 'pom.xml']
            api-gateway:       ['api-gateway/**', 'pom.xml']
            auth-service:      ['auth-service/**', 'pom.xml']
            job-service:       ['job-service/**', 'pom.xml']
            parts-service:     ['parts-service/**', 'pom.xml']
            customer-service:  ['customer-service/**', 'pom.xml']
            technician-service:['technician-service/**', 'pom.xml']
            notification-service: ['notification-service/**', 'pom.xml']
            payment-service:   ['payment-service/**', 'pom.xml']
            analytics-service: ['analytics-service/**', 'pom.xml']

  build:
    name: build & test
    needs: changes
    if: ${{ needs.changes.outputs.modules != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compute -pl arg
        id: pl
        run: |
          modules='${{ needs.changes.outputs.modules }}'
          pl=$(echo "$modules" | jq -r '. | join(",")')
          echo "value=$pl" >> "$GITHUB_OUTPUT"

      - name: Maven build (changed modules + dependents)
        run: |
          if [ -n "${{ steps.pl.outputs.value }}" ]; then
            mvn -B -pl "${{ steps.pl.outputs.value }}" -am --also-make-dependents \
                clean verify
          else
            mvn -B clean verify
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

  deploy:
    name: Oracle deployment handoff
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Oracle deployment
        run: |
          echo "Oracle deployment is performed manually with compose.oracle.yaml."
          echo "See deploy/oracle/README.md; this workflow does not provision cloud resources."

  oracle-arm64-images:
    name: Build ${{ matrix.service }} (linux/arm64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: api-gateway/Dockerfile
          - service: auth-service
            dockerfile: auth-service/Dockerfile
          - service: job-service
            dockerfile: job-service/Dockerfile
          - service: parts-service
            dockerfile: parts-service/Dockerfile
          - service: customer-service
            dockerfile: customer-service/Dockerfile
          - service: technician-service
            dockerfile: technician-service/Dockerfile
          - service: notification-service
            dockerfile: notification-service/Dockerfile
          - service: payment-service
            dockerfile: payment-service/Dockerfile
          - service: analytics-service
            dockerfile: analytics-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: false
          tags: serviceos/${{ matrix.service }}:ci-arm64
          cache-from: type=gha,scope=oracle-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=oracle-${{ matrix.service }}
